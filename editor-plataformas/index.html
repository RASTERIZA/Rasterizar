<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de Plataformas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#080b14; --bg2:#0d1220; --panel:#111829; --panel2:#171f35; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --txt:#eaf0ff; --mut:#8c98b4; --acc:#7c5cff; --acc2:#22d3ee; --warn:#ffb020; --ok:#34d399; --danger:#ff5d6c;
  --grad:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
  --r:12px; color-scheme:dark;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.4;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(124,92,255,.12),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(34,211,238,.08),transparent 60%),var(--bg)}
#app{display:grid;grid-template-columns:262px minmax(0,1fr) 296px;grid-template-rows:56px minmax(0,1fr) 28px;height:100dvh;gap:0}
button{font:inherit;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .05s}
button:hover{background:rgba(255,255,255,.1);border-color:var(--line2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
i[data-ic]{display:inline-flex}
.top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(10,14,26,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;white-space:nowrap}
.brand b{font-weight:800;letter-spacing:-.2px}.brand i{font-style:normal;font-weight:500;color:var(--mut)}
.logo{width:24px;height:24px;border-radius:7px;background:var(--grad);position:relative;box-shadow:0 0 18px rgba(124,92,255,.5)}
.logo::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:5px;border-radius:2px;background:#0b1020;box-shadow:0 -7px 0 -1px #0b1020}
.nameinp{width:210px;max-width:28vw;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--txt);font:600 14px Inter,system-ui,sans-serif;padding:6px 9px}
.nameinp:hover{border-color:var(--line)}.nameinp:focus{border-color:var(--acc);background:rgba(255,255,255,.04);outline:0}
.grow{flex:1}
.grp{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.grp button{background:transparent;border-color:transparent;padding:6px 9px}
.grp button:hover{background:rgba(255,255,255,.09)}
button.play{background:var(--grad);border:0;color:#06101c;font-weight:800;padding:8px 16px;box-shadow:0 6px 22px rgba(124,92,255,.35)}
button.play:hover{filter:brightness(1.1);background:var(--grad)}
button.play svg{fill:currentColor;stroke:none}
button.icon{padding:7px}
aside{overflow:auto;padding:12px;min-height:0;scrollbar-width:thin;scrollbar-color:#2a3350 transparent}
#left{border-right:1px solid var(--line);background:rgba(10,14,26,.5)}
#right{border-left:1px solid var(--line);background:rgba(10,14,26,.5);display:flex;flex-direction:column;gap:10px}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:12px}
.tools button{padding:8px 0;justify-content:center;background:transparent;border-color:transparent;color:var(--mut)}
.tools button:hover{color:var(--txt)}
.tools button.on{background:var(--grad);color:#07111e;box-shadow:0 4px 14px rgba(124,92,255,.35)}
h3{margin:14px 0 7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
h3:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pal{flex-direction:column;gap:4px;padding:7px 3px 6px;font-size:10.5px;color:var(--mut);text-align:center;line-height:1.15;min-height:70px;justify-content:center;border-radius:11px}
.pal canvas{width:34px;height:34px;image-rendering:pixelated;border-radius:6px}
.pal.on{border-color:var(--acc);background:rgba(124,92,255,.16);color:var(--txt);box-shadow:0 0 0 1px var(--acc) inset,0 6px 18px rgba(124,92,255,.22)}
#stage{display:grid;grid-template-rows:minmax(0,1fr) 58px;min-width:0;min-height:0;background:#05070d}
#edwrap{position:relative;min-height:0;overflow:hidden}
#ed{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.minirow{border-top:1px solid var(--line);background:#070a12;padding:6px 10px;display:flex}
#mini{width:100%;height:100%;border-radius:8px;border:1px solid var(--line);cursor:pointer;touch-action:none;background:#0b1020}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h2{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
label{display:flex;justify-content:space-between;margin:9px 0 3px;color:var(--mut);font-size:12px}
label b{color:var(--txt);font-weight:600}
input[type=number],select{width:100%;font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
select option{background:#111829}
input[type=range]{width:100%;accent-color:var(--acc);height:20px;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.themes button{flex-direction:column;padding:0 0 4px;gap:3px;font-size:10px;color:var(--mut);overflow:hidden;border-radius:10px}
.themes button i{display:block;width:100%;height:30px;border-radius:0}
.themes button.on{border-color:var(--acc2);color:var(--txt);box-shadow:0 0 0 1px var(--acc2) inset}
.musicrow{display:flex;gap:8px}.musicrow select{flex:1}.musicrow button{padding:7px 10px}
.hint{color:var(--mut);font-size:12px;line-height:1.5}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}.kv b{color:var(--txt)}
.ok{color:var(--ok)}.bad{color:var(--warn)}
footer{grid-column:1/4;display:flex;gap:18px;align-items:center;padding:0 14px;background:rgba(10,14,26,.78);border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden}
footer .msg{color:var(--ok)}footer .sp{flex:1}
kbd{background:rgba(255,255,255,.08);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:600 11px Inter,sans-serif;color:var(--txt)}
.help{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;align-items:center;font-size:13px}
.help h4{grid-column:1/3;margin:8px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#dlg{position:fixed;inset:0;z-index:20;background:rgba(3,5,12,.66);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg[hidden]{display:none}
#dlg .box{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#dlg p{margin:0;line-height:1.5}
#dlg textarea{width:100%;height:30vh;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;resize:none}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end}
#dlg .acts .primary{background:var(--grad);border:0;color:#06101c;font-weight:700}
#play{position:fixed;inset:0;background:#000;z-index:10;display:none}
#play.on{display:block}
#play canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;-webkit-user-select:none;user-select:none}
.touch{display:none}
@media (pointer:coarse){.kb{display:none}.touch{display:block}}
@media (max-width:1080px){.nameinp{display:none}.grp button span{display:none}}
@media (max-width:900px){
  body{overflow:auto}
  #app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
  .top{order:1;flex-wrap:wrap;gap:8px;padding:8px 10px;height:auto}
  #stage{order:2;flex:none;height:58vh}
  #left{order:3}#right{order:4}footer{order:5;height:auto;padding:6px 14px;flex-wrap:wrap;white-space:normal;gap:4px 14px}
  aside{border:0;border-top:1px solid var(--line);overflow:visible}
  .pgrid{grid-template-columns:repeat(4,1fr)}
  .brand i{display:none}
  .nameinp{display:block;order:9;flex:1 1 100%;max-width:none;width:100%;border-color:var(--line)}
}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand"><span class="logo"></span><b>Plataformas</b><i>Studio</i></div>
  <input id="pName" class="nameinp" maxlength="40" aria-label="Nombre del nivel" placeholder="Nombre del nivel">
  <span class="grow"></span>
  <div class="grp">
    <button id="bNew" title="Nivel nuevo"><i data-ic="new"></i><span>Nuevo</span></button>
    <button id="bOpen" title="Abrir un nivel guardado (.json)"><i data-ic="open"></i><span>Abrir</span></button>
    <button id="bSave" title="Guardar nivel (.json) · Ctrl+S"><i data-ic="save"></i><span>Guardar</span></button>
    <button id="bExport" title="Crear un juego jugable en un solo archivo HTML"><i data-ic="export"></i><span>Exportar</span></button>
  </div>
  <div class="grp">
    <button id="bUndo" title="Deshacer · Ctrl+Z"><i data-ic="undo"></i></button>
    <button id="bRedo" title="Rehacer · Ctrl+Y"><i data-ic="redo"></i></button>
    <button id="bGrid" title="Mostrar u ocultar la cuadrícula"><i data-ic="grid"></i></button>
  </div>
  <button id="bPlay" class="play" title="Probar el nivel · P"><i data-ic="play"></i>Probar</button>
  <button id="bHelp" class="icon" title="Ayuda y atajos"><i data-ic="help"></i></button>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
</header>

<aside id="left">
  <div id="tools" class="tools"></div>
  <div id="palette"></div>
</aside>

<main id="stage">
  <div id="edwrap"><canvas id="ed"></canvas></div>
  <div class="minirow"><canvas id="mini" title="Minimapa: toca para ir a otra zona"></canvas></div>
</main>

<aside id="right">
  <section class="card">
    <h2>Escenario</h2>
    <div id="themes" class="themes"></div>
    <div class="row">
      <div><label for="pW">Ancho</label><input type="number" id="pW" min="20" max="400"></div>
      <div><label for="pH">Alto</label><input type="number" id="pH" min="10" max="60"></div>
    </div>
  </section>
  <section class="card">
    <h2>Música</h2>
    <div class="musicrow"><select id="musicSel" aria-label="Pista de música"></select><button id="musicPrev" title="Escuchar"><i data-ic="note"></i></button></div>
    <label for="vMusic">Volumen de música <b id="vMusicV"></b></label><input type="range" id="vMusic" min="0" max="100">
    <label for="vSfx">Volumen de efectos <b id="vSfxV"></b></label><input type="range" id="vSfx" min="0" max="100">
  </section>
  <section class="card">
    <h2>Física y reglas</h2>
    <div id="settings"></div>
    <button id="bReset" style="margin-top:12px;width:100%;justify-content:center">Restablecer valores</button>
  </section>
  <section class="card">
    <h2>Resumen</h2>
    <div id="summary"></div>
  </section>
</aside>

<footer>
  <span id="stCell">—</span><span id="stTool"></span><span id="stZoom"></span><span class="sp"></span><span class="msg" id="stMsg"></span><span id="stSave"></span>
</footer>
</div>

<div id="dlg" hidden><div class="box" role="dialog" aria-modal="true"><p id="dMsg"></p><div id="dBody" hidden></div><textarea id="dText" readonly hidden></textarea>
  <div class="acts"><button id="dCopy" hidden>Copiar</button><button id="dNo" hidden>Cancelar</button><button id="dOk" class="primary">Aceptar</button></div></div></div>

<div id="play"><canvas id="game"></canvas></div>

<!-- ============================ MOTOR DEL JUEGO ============================
     Este bloque se reutiliza tal cual al exportar el juego como HTML. -->
<script id="engine">
const Engine = (() => {
'use strict';
const TS = 16, VW = 320, VH = 240;
const T = {EMPTY:0, GROUND:1, BRICK:2, QCOIN:3, QMUSH:4, SOLID:5, PTL:6, PTR:7, PBL:8, PBR:9, COIN:10, SPIKE:11, GOAL:12, CLOUD:13, BUSH:14, USED:15, GEM:16, SPRING:17};
const isSolid = id => (id >= 1 && id <= 9) || id === 15 || id === 17;
const DEFAULTS = {gravity:0.4, jump:7.4, speed:2.4, time:300, lives:3};
const FONT = '"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const pad = (n, l) => String(Math.max(0, n | 0)).padStart(l, '0');
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- Temas visuales ---------- */
const THEMES = {
  dia: {name: 'Día', track: 'aventura', sky: ['#2f8fff', '#8fd0ff', '#e2f4ff'],
    sun: {x: .78, y: .2, r: 15, core: '#fffbe3', glow: '255,246,200', a: .7},
    layers: [{c: '#a3cbec', base: .64, amp: 30, f: .012, k: .10}, {c: '#7bb2de', base: .72, amp: 26, f: .017, k: .2}, {c: '#4fa56f', base: .81, amp: 16, f: .026, k: .38}],
    clouds: {rgb: '255,255,255', a: .92}, stars: 0, dark: 0, grade: 'rgba(255,214,140,0.07)'},
  atardecer: {name: 'Tarde', track: 'turbo', sky: ['#24206b', '#b84a86', '#ff9a62', '#ffd08a'],
    sun: {x: .7, y: .64, r: 26, core: '#ffe6a6', glow: '255,150,80', a: .85},
    layers: [{c: '#6b3d7e', base: .64, amp: 30, f: .011, k: .10}, {c: '#4d2f6e', base: .72, amp: 26, f: .017, k: .2}, {c: '#2f2358', base: .81, amp: 16, f: .026, k: .38}],
    clouds: {rgb: '255,190,170', a: .55}, stars: 22, dark: 0, grade: 'rgba(255,110,60,0.10)'},
  noche: {name: 'Noche', track: 'noche', sky: ['#050818', '#13215a', '#2d4a94'],
    sun: {x: .8, y: .18, r: 11, core: '#f3f6ff', glow: '170,200,255', a: .55, moon: true},
    layers: [{c: '#1d2f6e', base: .64, amp: 30, f: .012, k: .10}, {c: '#162455', base: .72, amp: 26, f: .017, k: .2}, {c: '#0d1736', base: .81, amp: 16, f: .026, k: .38}],
    clouds: {rgb: '120,150,220', a: .2}, stars: 70, dark: .34, grade: 'rgba(70,100,230,0.10)'},
  cueva: {name: 'Cueva', track: 'cueva', sky: ['#07070d', '#150f22', '#261b3a'], sun: null,
    layers: [{c: '#1d1630', base: .70, amp: 24, f: .014, k: .12}, {c: '#140f1f', base: .79, amp: 20, f: .02, k: .26}],
    clouds: null, stars: 0, dark: .74, grade: 'rgba(130,70,220,0.10)', cave: true},
  neon: {name: 'Neón', track: 'neon', sky: ['#10002a', '#4b0f78', '#d6307f', '#ff8a4d'],
    sun: {x: .5, y: .66, r: 34, core: '#ffe45e', glow: '255,60,170', a: .8, neon: true},
    layers: [{c: '#1b0638', base: .72, amp: 34, f: .02, k: .10, line: '#ff4fd8', peaky: true}, {c: '#2a0a4a', base: .79, amp: 22, f: .03, k: .22, line: '#38e8ff', peaky: true}],
    clouds: null, stars: 50, dark: 0, grade: 'rgba(255,0,200,0.06)', neon: true},
};

/* ---------- Gráficos (todo dibujado por código, sin imágenes externas) ---------- */
const Sprites = (() => {
  const cache = {}, glowCache = {};
  const mk = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c; };
  const R = (g, col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const circ = (g, col, x, y, r) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  const ell = (g, col, x, y, rx, ry) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); };
  const tri = (g, col, pts) => { g.fillStyle = col; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); };

  const dirtBase = g => {
    R(g, '#b8651f', 0, 0, 16, 16); R(g, '#8a4513', 0, 15, 16, 1); R(g, '#8a4513', 15, 0, 1, 16);
    R(g, '#8a4513', 3, 8, 2, 2); R(g, '#8a4513', 10, 11, 2, 2); R(g, '#d0833a', 7, 6, 2, 1); R(g, '#d0833a', 2, 12, 2, 1);
  };
  cache.dirt = mk(16, 16, dirtBase);
  cache.ground = mk(16, 16, g => {
    dirtBase(g); R(g, '#3bb33b', 0, 0, 16, 5); R(g, '#69d85a', 0, 0, 16, 2); R(g, '#2a8a2e', 0, 5, 16, 1);
    for (const x of [1, 5, 9, 13]) R(g, '#2a8a2e', x, 6, 2, 1);
    R(g, 'rgba(0,0,0,.18)', 0, 6, 16, 2);
  });
  cache.brick = mk(16, 16, g => {
    R(g, '#c4501a', 0, 0, 16, 16);
    for (const y of [0, 5, 10, 15]) R(g, '#5e2208', 0, y, 16, 1);
    R(g, '#5e2208', 7, 1, 1, 4); R(g, '#5e2208', 3, 6, 1, 4); R(g, '#5e2208', 11, 6, 1, 4); R(g, '#5e2208', 7, 11, 1, 4);
    for (const y of [1, 6, 11]) R(g, '#e07a3a', 0, y, 16, 1);
  });
  const rivets = (g, c) => { for (const [x, y] of [[2, 2], [13, 2], [2, 13], [13, 13]]) R(g, c, x, y, 1, 1); };
  cache.q = mk(16, 16, g => {
    R(g, '#8a4b00', 0, 0, 16, 16); R(g, '#f2a900', 1, 1, 14, 14);
    R(g, '#ffd24a', 1, 1, 14, 1); R(g, '#ffd24a', 1, 1, 1, 14); R(g, '#c47a00', 14, 1, 1, 14); R(g, '#c47a00', 1, 14, 14, 1);
    rivets(g, '#8a4b00');
    const glyph = ['.###.', '#...#', '....#', '..##.', '..#..', '.....', '..#..'];
    glyph.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === '#') { R(g, '#8a4b00', 5 + i + 1, 4 + j + 1, 1, 1); R(g, '#fff6c8', 5 + i, 4 + j, 1, 1); } }));
  });
  cache.used = mk(16, 16, g => {
    R(g, '#4d3512', 0, 0, 16, 16); R(g, '#9a7338', 1, 1, 14, 14); R(g, '#b58c4a', 1, 1, 14, 1); R(g, '#7a5a28', 1, 14, 14, 1);
    rivets(g, '#4d3512');
  });
  cache.solid = mk(16, 16, g => {
    R(g, '#4a4a58', 0, 0, 16, 16); R(g, '#9494a4', 1, 1, 14, 14);
    R(g, '#e0e0ee', 1, 1, 14, 1); R(g, '#e0e0ee', 1, 1, 1, 14); R(g, '#6c6c7c', 1, 14, 14, 1); R(g, '#6c6c7c', 14, 1, 1, 14);
    R(g, '#a8a8b8', 3, 3, 10, 10);
  });
  const P = {fill: '#2fb039', hi: '#8be07a', sh: '#1c8a26', dk: '#0d5a14'};
  cache.ptl = mk(16, 16, g => { R(g, P.dk, 0, 0, 16, 16); R(g, P.fill, 1, 1, 15, 14); R(g, P.hi, 4, 2, 3, 12); });
  cache.ptr = mk(16, 16, g => { R(g, P.dk, 0, 0, 16, 16); R(g, P.fill, 0, 1, 15, 14); R(g, P.sh, 8, 2, 6, 12); });
  cache.pbl = mk(16, 16, g => { R(g, P.dk, 1, 0, 1, 16); R(g, P.fill, 2, 0, 14, 16); R(g, P.hi, 4, 0, 3, 16); });
  cache.pbr = mk(16, 16, g => { R(g, P.dk, 14, 0, 1, 16); R(g, P.fill, 0, 0, 14, 16); R(g, P.sh, 8, 0, 6, 16); });

const Backdrop = (() => {
  let seed = 11;
  const rr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const STARS = Array.from({length: 90}, () => ({x: rr(), y: rr(), r: rr() < .2 ? 1.6 : 1, ph: rr() * 6.28}));
  const CLOUDS = Array.from({length: 8}, () => ({x: rr() * 600, y: 14 + rr() * 90, s: .7 + rr() * .9, k: .12 + rr() * .18}));
  const MOTES = Array.from({length: 28}, () => ({x: rr() * 400, y: rr() * VH, v: .08 + rr() * .25, ph: rr() * 6.28, k: .2 + rr() * .3}));
  const CRYSTALS = Array.from({length: 9}, (_, i) => ({x: i * 83 + rr() * 40, y: .55 + rr() * .3, s: 3 + rr() * 4, h: rr() < .5 ? '90,210,255' : '255,90,220'}));
  const wrap = (v, w) => ((v % w) + w) % w;

  function ridge(g, L, vw, camx, ph) {
    g.beginPath(); g.moveTo(0, VH);
    for (let x = 0; x <= vw + 4; x += 4) {
      const wx = x + camx * L.k;
      let s = .55 * Math.sin(wx * L.f + ph) + .3 * Math.sin(wx * L.f * 2.3 + ph * 1.7) + .15 * Math.sin(wx * L.f * 5.1 + ph * .6);
      if (L.peaky) s = 1 - 2 * Math.abs(Math.sin(wx * L.f * .8 + ph));
      g.lineTo(x, VH * L.base - L.amp * s);
    }
    g.lineTo(vw + 4, VH); g.closePath(); g.fillStyle = L.c; g.fill();
    if (L.line) { g.strokeStyle = L.line; g.globalAlpha = .75; g.lineWidth = .8; g.stroke(); g.globalAlpha = 1; }
  }
  function cloud(g, x, y, s, c) {
    g.fillStyle = 'rgba(' + c.rgb + ',' + c.a + ')';
    for (const [dx, dy, rx, ry] of [[0, 0, 15, 6], [-10, -3, 9, 6], [6, -6, 11, 8], [15, -1, 9, 5]]) { g.beginPath(); g.ellipse(x + dx * s, y + dy * s, rx * s, ry * s, 0, 0, 6.283); g.fill(); }
  }
  function neonSun(g, th, x, y, r) {
    g.save(); g.beginPath(); g.arc(x, y, r, 0, 6.283); g.clip();
    const gr = g.createLinearGradient(0, y - r, 0, y + r); gr.addColorStop(0, '#ffe45e'); gr.addColorStop(.55, '#ff6a8a'); gr.addColorStop(1, '#ff2e93');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    g.fillStyle = th.sky[1];
    for (let i = 0; i < 6; i++) g.fillRect(x - r, y + r * (.08 + i * .16), r * 2, .8 + i * .7);
    g.restore();
  }
  function draw(g, th, vw, camx, camy, t) {
    const gr = g.createLinearGradient(0, 0, 0, VH);
    th.sky.forEach((c, i) => gr.addColorStop(i / (th.sky.length - 1), c));
    g.fillStyle = gr; g.fillRect(0, 0, vw, VH);
    if (th.stars) for (let i = 0; i < th.stars; i++) {
      const s = STARS[i], x = wrap(s.x * vw * 1.6 - camx * .03, vw), y = s.y * VH * (th.neon ? .6 : .8);
      g.fillStyle = 'rgba(255,255,255,' + (.3 + .7 * Math.abs(Math.sin(t * .03 + s.ph))) + ')'; g.fillRect(Math.round(x), Math.round(y), s.r, s.r);
    }
    if (th.sun) {
      const s = th.sun, x = s.x * vw - camx * .01, y = s.y * VH;
      const gl = g.createRadialGradient(x, y, s.r * .4, x, y, s.r * 4.2);
      gl.addColorStop(0, 'rgba(' + s.glow + ',' + s.a + ')'); gl.addColorStop(1, 'rgba(' + s.glow + ',0)');
      g.fillStyle = gl; g.fillRect(x - s.r * 4.2, y - s.r * 4.2, s.r * 8.4, s.r * 8.4);
      if (s.neon) neonSun(g, th, x, y, s.r);
      else {
        g.fillStyle = s.core; g.beginPath(); g.arc(x, y, s.r, 0, 6.283); g.fill();
        if (s.moon) { g.fillStyle = 'rgba(30,45,110,.4)'; g.beginPath(); g.arc(x + 4, y - 2, s.r * .8, 0, 6.283); g.fill(); }
      }
    }
    if (th.neon) {                       // suelo de rejilla en perspectiva
      const hy = VH * .74;
      const fg = g.createLinearGradient(0, hy, 0, VH); fg.addColorStop(0, 'rgba(255,60,200,.0)'); fg.addColorStop(1, 'rgba(40,0,80,.55)');
      g.fillStyle = fg; g.fillRect(0, hy, vw, VH - hy);
      g.strokeStyle = 'rgba(255,90,220,.55)'; g.lineWidth = .6; g.beginPath();
      for (let i = -14; i <= 14; i++) { const bx = vw / 2 + i * 38 - (camx * .6) % 38; g.moveTo(vw / 2 + (bx - vw / 2) * .12, hy); g.lineTo(bx, VH); }
      for (let i = 0; i < 9; i++) { const f = ((i + (t * .012)) % 9) / 9, y = hy + (VH - hy) * f * f; g.moveTo(0, y); g.lineTo(vw, y); }

      for (const c of CRYSTALS) {

        g.drawImage(Sprites.glow(c.h), x - c.s * 3, y - c.s * 3, c.s * 6, c.s * 6);
        g.fillStyle = 'rgba(' + c.h + ',' + (.55 + .3 * p) + ')'; g.beginPath(); g.moveTo(x, y - c.s * 1.4); g.lineTo(x + c.s * .6, y); g.lineTo(x, y + c.s * .5); g.lineTo(x - c.s * .6, y); g.closePath(); g.fill();
      }
    }
    if (th.cave || th.neon || th.stars > 20) for (const m of MOTES) {
      const x = wrap(m.x - camx * m.k - t * m.v, vw + 20) - 10, y = wrap(m.y + Math.sin(t * .02 + m.ph) * 8 - t * m.v * .3, VH);
      g.fillStyle = 'rgba(' + (th.neon ? '255,120,230' : '170,140,255') + ',' + (.15 + .25 * Math.abs(Math.sin(t * .03 + m.ph))) + ')'; g.fillRect(Math.round(x), Math.round(y), 1.5, 1.5);
    }
  }
  return {draw};
})();

  const showVol = () => { $('vMusicV').textContent = vm.value + '%'; $('vSfxV').textContent = vs.value + '%'; };
  vm.oninput = () => { Audio.setVolume('music', vm.value / 100); showVol(); }; vs.oninput = () => { Audio.setVolume('sfx', vs.value / 100); showVol(); };
  vs.onchange = () => { Audio.init(); Audio.sfx('coin'); };
  showVol();
  const st = $('settings');
  for (const s of SETTINGS) {
    const lab = document.createElement('label'); lab.innerHTML = `${s.label}<b id="v_${s.k}"></b>`; lab.htmlFor = 's_' + s.k;
    const inp = document.createElement('input'); inp.type = 'range'; inp.id = 's_' + s.k; inp.min = s.min; inp.max = s.max; inp.step = s.step;
    inp.oninput = () => { L.settings[s.k] = +inp.value; $('v_' + s.k).textContent = inp.value; changed(); };
    st.appendChild(lab); st.appendChild(inp);
  }
  $('pName').oninput = e => { L.name = e.target.value; changed(); };
  const sz = () => resizeLevel(+$('pW').value, +$('pH').value);
  $('pW').onchange = sz; $('pH').onchange = sz;
  $('bReset').onclick = () => { L.settings = Object.assign({}, DEFAULTS); refreshUi(); changed(); };
  $('bUndo').onclick = undo; $('bRedo').onclick = redo; $('bPlay').onclick = play; $('bHelp').onclick = help;
  $('bNew').onclick = newLevel; $('bOpen').onclick = () => $('fileIn').click(); $('bSave').onclick = saveFile; $('bExport').onclick = exportGame;
  $('fileIn').onchange = openFile;
  $('bGrid').onclick = () => { showGrid = !showGrid; $('bGrid').style.opacity = showGrid ? 1 : .45; dirty = true; };
}
function previewTrack() {
  const id = L.music === 'none' ? '' : (TRACKS[L.music] ? L.music : THEMES[L.theme].track);
  Audio.init(); if (id) Audio.play(id); else Audio.stop();
}
function updatePreviewBtn() { $('musicPrev').innerHTML = svg(previewing ? 'stop' : 'note'); $('musicPrev').title = previewing ? 'Detener' : 'Escuchar'; }
function refreshUi() {
  $('pName').value = L.name; $('pW').value = L.w; $('pH').value = L.h;
  document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.id === L.theme));
  $('musicSel').value = L.music;
  for (const s of SETTINGS) { $('s_' + s.k).value = L.settings[s.k]; $('v_' + s.k).textContent = L.settings[s.k]; }
  updateButtons(); summary(); clampView(); dirty = true; miniDirty = true;
}
function updateButtons() { $('bUndo').disabled = !undoStack.length; $('bRedo').disabled = !redoStack.length; }
function summary() {
  let blocks = 0, coins = 0, gems = 0, goals = 0;
  for (const t of L.tiles) { if (t === 10) coins++; else if (t === 12) goals++; else if (t === 16) gems++; else if (t >= 2 && t <= 4) blocks++; }
  const en = L.entities.filter(e => e.type !== 'player').length, pl = L.entities.some(e => e.type === 'player');
  const warn = [];
  if (!pl) warn.push('Falta el punto de inicio del jugador.');
  if (!goals) warn.push('No hay meta: el nivel no se puede completar.');
  $('summary').innerHTML = `<div class="kv">Monedas<b>${coins}</b></div><div class="kv">Gemas<b>${gems}</b></div><div class="kv">Bloques<b>${blocks}</b></div><div class="kv">Enemigos<b>${en}</b></div>` +
    (warn.length ? '<div class="bad" style="margin-top:6px">⚠ ' + warn.join('<br>⚠ ') + '</div>' : '<div class="ok" style="margin-top:6px">✓ Nivel listo para jugar</div>');
}
function msg(t) { const m = $('stMsg'); m.textContent = t; clearTimeout(msg.t); msg.t = setTimeout(() => { m.textContent = ''; }, 3500); }

/* ---------- Archivos ---------- */
const slug = s => (s || 'nivel').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'nivel';
function download(name, text, type) {
  if (COPY_MODE) { dialog('Este visor no permite descargar archivos. Copia el texto y guárdalo como «' + name + '».', {text}); return false; }
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], {type}));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}
function saveFile() { if (download(slug(L.name) + '.json', JSON.stringify(L), 'application/json')) msg('Nivel guardado como ' + slug(L.name) + '.json'); }
function openFile(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { L = validate(JSON.parse(rd.result)); undoStack.length = redoStack.length = 0; view.x = -16; view.y = 0; changed(); refreshUi(); msg('Nivel abierto: ' + L.name); }
    catch (err) { dialog('No se pudo abrir el archivo: ' + err.message); }
  };
  rd.readAsText(f);
}
async function newLevel() {
  if (!await dialog('¿Crear un nivel nuevo? Se perderán los cambios no guardados.', {confirm: true})) return;
  L = emptyLevel(80, 15); undoStack.length = redoStack.length = 0; view.x = -16; view.y = 0; changed(); refreshUi();
}
function exportGame() {
  const engine = $('engine').textContent, lvl = JSON.stringify(L).replace(/</g, '\\u003c');
  const title = L.name.replace(/[<>&"]/g, '');
  const html = '<!doctype html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">' +
    '<title>' + title + '</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;height:100dvh;image-rendering:pixelated;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style></head>' +
    '<body><canvas id="c"></canvas><script>' + engine + '<\/script><script>Engine.run(document.getElementById("c"),' + lvl + ',{title:true});<\/script></body></html>';
  if (download(slug(L.name) + '-juego.html', html, 'text/html')) msg('Juego exportado: ábrelo con doble clic en cualquier navegador.');
}

/* ---------- Probar ---------- */
function play() {
  if (playing || dlgOpen) return;
  previewing = false; updatePreviewBtn(); Audio.stop();
  $('play').classList.add('on');
  playing = Engine.run($('game'), L, {onExit: stopPlay});
  window.__game = playing;
}
function stopPlay() { if (!playing) return; playing.destroy(); playing = null; $('play').classList.remove('on'); dirty = true; }

/* ---------- Inicio ---------- */
buildUi();
try {
  const s = localStorage.getItem(STORE) || localStorage.getItem('plataformas.nivel.v1');
  if (s) L = validate(JSON.parse(s));
} catch (e) { /* se usa el ejemplo */ }
new ResizeObserver(() => { fit(); clampView(); }).observe($('stage'));
selectBrush(PALETTE[0]); setTool('pencil'); refreshUi(); fit(); updatePreviewBtn();
window.__editor = {get level() { return L; }, play, stopPlay, setTool, selectBrush, PALETTE, get previewing() { return previewing; }, get view() { return view; }};
})();
</script>
</body>
</html>
